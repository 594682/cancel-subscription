plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '2.0.0'
group = 'com.example.cancelsubscription'
base { archivesName = 'cancel-subscription' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.209'
    runs { client { client() } }
    mods { cancelsubscription { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
